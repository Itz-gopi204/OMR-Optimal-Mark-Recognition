# OMR Evaluation System - Docker Compose

version: '3.8'

services:
  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DATABASE=omr_evaluation
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEBUG=true
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      - mongo
      - redis
    networks:
      - omr-network

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omr-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DATABASE=omr_evaluation
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      - mongo
      - redis
    networks:
      - omr-network

  # MongoDB
  mongo:
    image: mongo:6
    container_name: omr-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - omr-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: omr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - omr-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio
    container_name: omr-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - omr-network

  # Frontend (uncomment when ready)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: omr-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api
  #   networks:
  #     - omr-network

volumes:
  mongo_data:
  redis_data:
  minio_data:
  uploads_data:

networks:
  omr-network:
    driver: bridge
